<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>MiniWebGame</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script>/* crash report helpers, read by perf.gd. Everything here goes to localStorage, which saves at once (a dying tab keeps it). */(function(){var LS=null;try{LS=window.localStorage;}catch(x){}function get(k){try{return LS?LS.getItem(k):null;}catch(x){return null;}}function put(k,v){try{if(LS)LS.setItem(k,v);}catch(x){}}put('er_prev_live',get('er_live')||'');put('er_prev_end',get('er_end')||'');put('er_end','died');put('er_live','');var M=WebAssembly.Memory;window.__erMems=[];WebAssembly.Memory=function(d){var m=new M(d);window.__erMems.push(m);return m;};WebAssembly.Memory.prototype=M.prototype;function keep(r){try{var e=(r.instance||r).exports;for(var k in e){if(e[k] instanceof M&&window.__erMems.indexOf(e[k])<0)window.__erMems.push(e[k]);}}catch(x){}return r;}var I=WebAssembly.instantiate;WebAssembly.instantiate=function(){return I.apply(this,arguments).then(keep);};if(WebAssembly.instantiateStreaming){var S=WebAssembly.instantiateStreaming;WebAssembly.instantiateStreaming=function(){return S.apply(this,arguments).then(keep);};}var errs=[],samples=[];window.__erLastFrame=0;window.__erPush=function(o){samples.push(o);if(samples.length>60)samples.shift();window.__erLastFrame=performance.now();};function save(){put('er_live',JSON.stringify({p:Math.round(performance.now()),f:Math.round(window.__erLastFrame),errors:errs,samples:samples}));}function add(k,m,st){try{errs.push({k:k,t:Math.round(performance.now()),m:String(m).slice(0,300),s:String(st||'').split(String.fromCharCode(10)).slice(0,4).join(' | ').slice(0,400)});if(errs.length>20)errs.shift();if(k!=='console')save();}catch(x){}}window.addEventListener('error',function(e){add('error',e.message,e.error&&e.error.stack);});window.addEventListener('unhandledrejection',function(e){var r=e.reason;add('rejection',(r&&r.message)||r,r&&r.stack);});var ce=console.error;console.error=function(){add('console',Array.prototype.join.call(arguments,' '),'');return ce.apply(console,arguments);};window.addEventListener('webglcontextlost',function(){add('gpu','webgl context lost','');},true);window.addEventListener('webglcontextrestored',function(){add('gpu','webgl context restored','');},true);document.addEventListener('visibilitychange',function(){add('page',document.visibilityState,'');});setInterval(save,1000);window.addEventListener('pagehide',function(){var fz=window.__erLastFrame>0&&performance.now()-window.__erLastFrame>3000;save();put('er_end',fz?'frozen':'closed');});})();</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9190116,"index.wasm":1508095},"focusCanvas":true,"gdextensionLibs":["thorn_runtime.web.template_release.wasm32.nothreads.wasm"],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
